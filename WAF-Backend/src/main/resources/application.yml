spring:
  application:
    name: waf-ap-manager

  profiles:
    active: dev

  datasource:
    url: jdbc:h2:file:./data/wafap;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  servlet:
    context-path: /api

# Security Configuration
security:
  jwt:
    secret: ${JWT_SECRET:changeme-very-long-secret-key-for-jwt-signing-at-least-256-bits}
    expiration: 86400000 # 24 hours in milliseconds

# WAF-AP Manager Configuration
wafap:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}

  dhcp:
    leases-file: /var/lib/dnsmasq/dhcp.leases
    scan-interval: 60000 # 1 minute

  ssh:
    max-failed-attempts: 5
    ban-duration: 3600 # 1 hour in seconds

  modsecurity:
    severity-threshold: 3 # Ban if severity >= 3

  iptables:
    sudo-script-path: /opt/wafap/scripts
    ban-script: ban-device.sh
    unban-script: unban-device.sh
    reload-script: reload-firewall.sh

  dnsmasq:
    blacklist-file: /etc/dnsmasq.d/blacklist.conf

  dns:
    log-file: /var/log/dnsmasq-queries.log

# Logging
logging:
  level:
    root: INFO
    com.wafap: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/wafap.log

# Springdoc OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
